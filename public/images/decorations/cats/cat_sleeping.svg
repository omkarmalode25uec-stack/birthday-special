<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Cute Sleeping Kitten on a tiny pillow -->
  <defs>
    <radialGradient id="catbody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE8D5"/>
    </radialGradient>
  </defs>
  <!-- Pillow -->
  <rect x="20" y="80" width="80" height="25" rx="12" fill="#DCCBFA" opacity="0.8"/>
  <rect x="24" y="82" width="72" height="21" rx="10" fill="#EBDDFE"/>
  <!-- Curled Body -->
  <ellipse cx="60" cy="74" rx="28" ry="18" fill="url(#catbody)"/>
  <!-- Tail curled around -->
  <path d="M86 78 Q96 74 92 62 Q88 56 84 62" stroke="#FDE8D5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Head tucked -->
  <circle cx="44" cy="66" r="16" fill="url(#catbody)"/>
  <!-- Ears -->
  <polygon points="34,54 30,42 42,48" fill="#FDE8D5"/>
  <polygon points="33,52 32,45 40,49" fill="#FFD6DE"/>
  <polygon points="46,50 56,42 54,54" fill="#FDE8D5"/>
  <polygon points="48,51 54,45 53,53" fill="#FFD6DE"/>
  <!-- Sleeping Eyes -->
  <path d="M37 66 Q41 70 45 66" stroke="#523E5E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="36" cy="71" r="3" fill="#F58BAA" opacity="0.6"/>
  <!-- Tiny Nose -->
  <circle cx="42" cy="70" r="1.5" fill="#F58BAA"/>
  <!-- Zzz bubbles -->
  <text x="68" y="52" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F58BAA">z</text>
  <text x="76" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#DCCBFA">z</text>
  <text x="86" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F58BAA">Z</text>
</svg>
